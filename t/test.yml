vars: 
  dir: 'somedir' 
  package: 'my package'
  cmd_var: 
    command: 'test 0 -eq 1'
    default: 6
  pwd:
    command: pwd | tr -d '\n'
blocks:
  - name: test
    desc: "test version 2"
    vars:
      dir: 'localdir'
      file: 'somefile'
      truevar: 
        env: IS_TRUE
        default: 0
      some_list:
        - 'this'
        - 'that' 
    shell: 
      - echo 'version 2 [%package%] [%dir%] [%file%] [%cmd_var%] [%pwd%]'
      - echo 'second shell command'
    commands:
      - diag: diag dir [%var%] [%pwd%]
        for-vars: some_list
      - exec: echo 'shell with for-vars [%var%]'
        for-vars: 
          - 'one'
          - 'two'
      - exec: echo 'conditional command'
        condition: 1 -eq [%truevar%]

